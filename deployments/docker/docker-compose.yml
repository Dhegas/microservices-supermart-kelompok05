version: "3.9"

# ============================================================
# SuperMart Monorepo – Database Orchestration
# Kelompok 05
# ============================================================

services:

  # ── Identity Service Database (PostgreSQL) ─────────────────
  identity-db:
    image: postgres:15-alpine
    container_name: supermart-identity-db
    restart: always
    environment:
      POSTGRES_DB: identity_service_db
      POSTGRES_USER: identity_admin
      POSTGRES_PASSWORD: identity_secret_pass
    ports:
      - "5431:5432"
    volumes:
      - identity_db_data:/var/lib/postgresql/data
      - ./init-scripts/identity:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_admin -d identity_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - supermart-network

  # ── Catalog Service Database (MongoDB) ─────────────────────
  catalog-db:
    image: mongo:6.0
    container_name: supermart-catalog-db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: catalog_admin
      MONGO_INITDB_ROOT_PASSWORD: catalog_secret_pass
      MONGO_INITDB_DATABASE: catalog_service_db
    ports:
      - "27017:27017"
    volumes:
      - catalog_db_data:/data/db
      - ./init-scripts/catalog/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - supermart-network

networks:
  supermart-network:
    driver: bridge
    name: supermart-isolated-net

volumes:
  identity_db_data:
  catalog_db_data:
